services:
  db:
    image: postgres:16
    container_name: marketing_db_local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketing_portal_dev
    ports:
      - "3006:5432"
    volumes:
      - marketing_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketing_portal_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marketing_db_data:
