services:
  db:
    image: postgres:17  # same major version as production (Supabase), so pull_prod_to_local can copy it
    container_name: marketing_db_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketing_portal_dev
    ports:
      - "3009:5432"
    volumes:
      - marketing_db_data_17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketing_portal_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marketing_db_data_17:
